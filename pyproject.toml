# Read by Vercel to pick the Python version and the web app's libraries
# (the same list as requirements.txt). The app is built and tested on 3.12.
[project]
name = "gsu-fleetfuel"
version = "1.0.0"
requires-python = "==3.12.*"
dependencies = [
    "Flask==3.0.3",
    "Flask-WTF==1.2.1",
    "PyMySQL==1.1.1",
    "cryptography==43.0.0",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scikit-learn==1.5.1",
    "joblib==1.4.2",
    "python-dotenv==1.0.1",
    "Werkzeug==3.0.3",
    "Pillow==12.3.0",
]
