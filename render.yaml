# Render Blueprint (render.com > New > Blueprint > this repository).
# Builds the Dockerfile; Render sets PORT and serves the app over HTTPS.
services:
  - type: web
    name: fleetfuel
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /login
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # The Firebase key: upload firebase-key.json as a Secret File
      # (Environment > Secret Files); Render puts it at this path.
      - key: FIREBASE_CREDENTIALS
        value: /etc/secrets/firebase-key.json
