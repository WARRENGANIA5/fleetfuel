# Render Blueprint: builds the Dockerfile.
services:
  - type: web
    name: fleetfuel
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /login
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # upload firebase-key.json under Environment > Secret Files
      - key: FIREBASE_CREDENTIALS
        value: /etc/secrets/firebase-key.json
