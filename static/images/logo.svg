<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GSU FleetFuel logo">
  <title>GSU FleetFuel</title>
  <defs>
    <linearGradient id="ff-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12345f"/>
      <stop offset="1" stop-color="#0a1f3d"/>
    </linearGradient>
    <linearGradient id="ff-drop" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#26e5ff"/>
      <stop offset="1" stop-color="#2697ff"/>
    </linearGradient>
    <clipPath id="ff-clip">
      <path d="M32 8.5C27.5 15 15 27.5 15 39.5a17 17 0 0 0 34 0C49 27.5 36.5 15 32 8.5Z"/>
    </clipPath>
  </defs>
  <!-- tile -->
  <rect width="64" height="64" rx="14" fill="url(#ff-tile)"/>
  <!-- fuel drop -->
  <path d="M32 8.5C27.5 15 15 27.5 15 39.5a17 17 0 0 0 34 0C49 27.5 36.5 15 32 8.5Z" fill="url(#ff-drop)"/>
  <g clip-path="url(#ff-clip)">
    <!-- prediction band around the fitted line -->
    <path d="M14 45.5 50 19.7 50 30.7 14 56.5Z" fill="#ffffff" fill-opacity="0.18"/>
  </g>
  <!-- observed trips (data points) -->
  <g fill="#0a1f3d">
    <circle cx="23" cy="40.3" r="2"/>
    <circle cx="27.6" cy="45" r="2"/>
    <circle cx="32.2" cy="33.7" r="2"/>
    <circle cx="36.8" cy="39.2" r="2"/>
    <circle cx="41.3" cy="28.6" r="2"/>
  </g>
  <!-- fitted regression line -->
  <path d="M19.8 46.7 45.2 28.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>
