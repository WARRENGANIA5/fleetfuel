<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GSU FleetFuel logo">
  <title>GSU FleetFuel</title>
  <defs>
    <linearGradient id="ff-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15396a"/>
      <stop offset="1" stop-color="#0a1f3d"/>
    </linearGradient>
    <linearGradient id="ff-drop" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#3cf0ff"/>
      <stop offset="1" stop-color="#2481ff"/>
    </linearGradient>
    <linearGradient id="ff-van" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6e6ff"/>
    </linearGradient>
    <clipPath id="ff-clip">
      <path d="M32 5C28 11 18.5 20.5 18.5 28.5a13.5 13.5 0 0 0 27 0C45.5 20.5 36 11 32 5Z"/>
    </clipPath>
  </defs>
  <!-- tile -->
  <rect width="64" height="64" rx="14" fill="url(#ff-tile)"/>
  <!-- fuel drop: the fuel consumed per trip (what the model predicts) -->
  <path d="M32 5C28 11 18.5 20.5 18.5 28.5a13.5 13.5 0 0 0 27 0C45.5 20.5 36 11 32 5Z" fill="url(#ff-drop)"/>
  <g clip-path="url(#ff-clip)">
    <!-- ± RMSE band around the fitted line -->
    <path d="M16 37.5 48 18.5 48 26.5 16 45.5Z" fill="#ffffff" fill-opacity="0.2"/>
  </g>
  <!-- trips (data points) -->
  <g fill="#0a1f3d">
    <circle cx="25" cy="33.6" r="1.7"/>
    <circle cx="29" cy="35.2" r="1.7"/>
    <circle cx="32.6" cy="28.4" r="1.7"/>
    <circle cx="36.4" cy="29.6" r="1.7"/>
    <circle cx="39.6" cy="23.6" r="1.7"/>
  </g>
  <!-- fitted Linear Regression line -->
  <path d="M22.5 37.2 42.5 25.3" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round"/>
  <!-- road: distance traveled -->
  <path d="M8 57.5H56" stroke="#26e5c5" stroke-opacity="0.45" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3.2 2.6"/>
  <!-- government service van -->
  <path d="M12.5 46.2c0-1.3 1-2.2 2.2-2.2h24.6c1 0 1.9.5 2.4 1.3l3.7 4.6h2.6c1.7 0 3.1 1.4 3.1 3.1v1.8c0 .8-.6 1.4-1.4 1.4H13.9c-.8 0-1.4-.6-1.4-1.4Z" fill="url(#ff-van)"/>
  <g fill="#15396a">
    <rect x="15.4" y="45.8" width="5.4" height="3.6" rx="0.8"/>
    <rect x="22.4" y="45.8" width="5.4" height="3.6" rx="0.8"/>
    <rect x="29.4" y="45.8" width="5.4" height="3.6" rx="0.8"/>
    <path d="M36.4 45.8h3c.4 0 .8.2 1 .5l2.4 3.1h-6.4Z"/>
  </g>
  <rect x="12.5" y="51.4" width="38.6" height="1.1" fill="#26e5c5" fill-opacity="0.9"/>
  <g fill="#0a1f3d" stroke="#d6e6ff" stroke-width="1.2">
    <circle cx="20" cy="55.2" r="2.9"/>
    <circle cx="43.6" cy="55.2" r="2.9"/>
  </g>
  <g fill="#26e5c5">
    <circle cx="20" cy="55.2" r="0.9"/>
    <circle cx="43.6" cy="55.2" r="0.9"/>
  </g>
</svg>
