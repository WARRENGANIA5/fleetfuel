<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GSU FleetFuel logo">
  <title>GSU FleetFuel</title>
  <!-- A fuel drop (fuel consumed per trip) with the fleet's road running into it.
       The road's centre marks rise toward the top: trips along a fitted trend. -->
  <defs>
    <linearGradient id="ff-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173f73"/>
      <stop offset="1" stop-color="#081a35"/>
    </linearGradient>
    <linearGradient id="ff-drop" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#45f3ff"/>
      <stop offset="0.55" stop-color="#2a9bff"/>
      <stop offset="1" stop-color="#1f5fe0"/>
    </linearGradient>
    <linearGradient id="ff-road" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0a1f3d" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0a1f3d" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="ff-shine" cx="0.32" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ff-clip">
      <path d="M32 5C26.6 13.2 13.5 25.8 13.5 38.4a18.5 18.5 0 0 0 37 0C50.5 25.8 37.4 13.2 32 5Z"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#ff-tile)"/>
  <path d="M32 5C26.6 13.2 13.5 25.8 13.5 38.4a18.5 18.5 0 0 0 37 0C50.5 25.8 37.4 13.2 32 5Z" fill="url(#ff-drop)"/>
  <g clip-path="url(#ff-clip)">
    <ellipse cx="25.5" cy="21" rx="9.5" ry="14" fill="url(#ff-shine)"/>
    <!-- road surface -->
    <path d="M18.2 60 30.7 24.5h2.6L45.8 60Z" fill="url(#ff-road)"/>
    <!-- road edges, narrowing into the distance -->
    <path d="M17.6 60 30.5 24.5h.7L19.9 60Z" fill="#ffffff"/>
    <path d="M46.4 60 33.5 24.5h-.7L44.1 60Z" fill="#ffffff"/>
    <!-- centre marks -->
    <g fill="#5ff7d6">
      <rect x="30.85" y="50" width="2.3" height="5.6" rx="1.15"/>
      <rect x="31.1" y="41.4" width="1.8" height="4.4" rx="0.9"/>
      <rect x="31.33" y="34.5" width="1.34" height="3.3" rx="0.67"/>
      <rect x="31.5" y="29.1" width="1" height="2.4" rx="0.5"/>
    </g>
  </g>
</svg>
