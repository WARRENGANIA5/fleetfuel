{# Flowing blue light streaks behind the login, sign-up and waiting pages. #}
<svg class="auth-bg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="streakA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f8bff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#4cb4ff"/>
      <stop offset="0.7" stop-color="#bfe3ff"/>
      <stop offset="1" stop-color="#1f8bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streakB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2697ff"/>
      <stop offset="1" stop-color="#26e5ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streakDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2433" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2a3546"/>
      <stop offset="1" stop-color="#1b2433" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g class="streak-group">
    <path class="streak streak-band" d="M-80 380 C 300 120, 640 160, 900 300 S 1300 520, 1540 260" stroke="url(#streakDark)" stroke-width="90" opacity="0.7"/>
    <path class="streak streak-band" d="M-60 820 C 360 560, 760 640, 1040 520 S 1380 300, 1520 380" stroke="url(#streakDark)" stroke-width="120" opacity="0.6"/>
    <path class="streak streak-glow" d="M-40 300 C 260 140, 560 120, 820 230 S 1240 470, 1500 200" stroke="url(#streakA)" stroke-width="10"/>
    <path class="streak" d="M-40 300 C 260 140, 560 120, 820 230 S 1240 470, 1500 200" stroke="url(#streakA)" stroke-width="2.5"/>
    <path class="streak streak-glow" d="M-60 120 C 300 40, 520 20, 760 90 S 1160 260, 1500 60" stroke="url(#streakB)" stroke-width="8"/>
    <path class="streak" d="M-60 120 C 300 40, 520 20, 760 90 S 1160 260, 1500 60" stroke="url(#streakB)" stroke-width="1.5"/>
    <path class="streak streak-glow" d="M-80 700 C 280 520, 660 600, 960 560 S 1320 420, 1520 520" stroke="url(#streakA)" stroke-width="12"/>
    <path class="streak" d="M-80 700 C 280 520, 660 600, 960 560 S 1320 420, 1520 520" stroke="url(#streakA)" stroke-width="3"/>
    <path class="streak" d="M-60 760 C 300 600, 680 680, 980 620 S 1340 480, 1520 590" stroke="url(#streakB)" stroke-width="1.2" opacity="0.8"/>
    <path class="streak streak-glow" d="M600 960 C 760 760, 1000 700, 1200 760 S 1440 900, 1560 820" stroke="url(#streakB)" stroke-width="9"/>
    <path class="streak" d="M600 960 C 760 760, 1000 700, 1200 760 S 1440 900, 1560 820" stroke="url(#streakB)" stroke-width="2"/>
  </g>
</svg>
