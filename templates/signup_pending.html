<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waiting for Approval | {{ org.org_short }} Fleet Fuel Prediction System</title>
<link rel="icon" href="{{ url_for('static', filename='images/favicon.svg', v=4) }}" type="image/svg+xml">
<link href="{{ url_for('static', filename='vendor/poppins/poppins.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css', v=29) }}" rel="stylesheet">
</head>
<body>
<div class="login-page">
  <div class="login-card text-center">
    <div class="login-logo"><img src="{{ url_for('static', filename='images/logo.svg', v=4) }}" alt="{{ org.system_short }} logo"></div>
    <div class="login-title">Waiting for approval</div>
    <div class="login-sub">Fuel Consumption Prediction System</div>

    <div class="pending-spinner" aria-hidden="true"><i class="fa-solid fa-hourglass-half"></i></div>
    <p class="mb-1">Hello, <strong>{{ user.full_name }}</strong> ({{ user.username }}).</p>
    <p class="text-muted small mb-3">Keep this page open. You'll be signed in automatically once your account is approved.</p>
    <div class="pending-status" id="pendingStatus" aria-live="polite">
      <span class="pending-dot"></span> Checking for approval&hellip; <span id="pendingChecked"></span>
    </div>

    <form method="POST" action="{{ url_for('signup_cancel') }}" class="mt-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="btn btn-outline-navy w-100"><i class="fa-solid fa-arrow-left me-1"></i> Back to Login</button>
    </form>
  </div>
  <div class="login-footer">&copy; {{ current_year }} {{ org.org_name }} &middot; {{ org.office_name }}</div>
</div>

<script>
// Ask the server every 3 seconds; it signs this browser in once the account is approved.
(function () {
  const checked = document.getElementById('pendingChecked');
  let busy = false;
  function poll() {
    if (busy) return;
    busy = true;
    fetch('{{ url_for("api_signup_status") }}', { headers: { 'Accept': 'application/json' }, cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.redirect) { window.location.href = d.redirect; return; }
        checked.textContent = '(last checked ' + new Date().toLocaleTimeString() + ')';
      })
      .catch(function () { checked.textContent = '(offline, retrying...)'; })
      .then(function () { busy = false; });
  }
  setInterval(poll, 3000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
})();
</script>
</body>
</html>
